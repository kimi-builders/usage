name: Parser compatibility / 解析兼容性
description: Report missing or incorrect local usage for a specific Agent version / 报告特定 Agent 版本的用量缺失或错误
title: "[Parser]: "
labels: [parser, compatibility]
body:
  - type: markdown
    attributes:
      value: |
        Do not upload raw JSONL, SQLite databases, prompts, responses, full paths, session IDs, or credentials. A minimal synthetic fixture is preferred.
        不要上传原始 JSONL、SQLite 数据库、提示词、回复、完整路径、会话 ID 或凭据；优先提供最小虚构 fixture。
  - type: input
    id: source
    attributes:
      label: Agent and version / Agent 与版本
      placeholder: Claude Code 2.x / Codex 0.x / Kimi Code 1.x
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS, architecture, and Node version / 系统、架构与 Node 版本
    validations:
      required: true
  - type: dropdown
    id: symptom
    attributes:
      label: Symptom / 现象
      options:
        - Source is not detected / 未检测到来源
        - Source fails to parse / 来源解析失败
        - Buckets or sessions are missing / Bucket 或会话缺失
        - Token categories are incorrect / Token 分类错误
        - Model, reasoning effort, or Agent version is incorrect / 模型、推理强度或 Agent 版本错误
        - Time or activity is incorrect / 时间或活跃数据错误
        - Duplicate data / 数据重复
        - Other / 其他
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Redacted summary and reproduction / 脱敏摘要与复现
      description: Include counts or percentages, not conversation content. / 提供计数或百分比，不要提供对话内容。
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Reviewed doctor output / 已检查的 doctor 输出
      render: json
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check / 隐私检查
      options:
        - label: I did not attach raw Agent data, credentials, full paths, project identity, or conversation content. / 我没有附上原始 Agent 数据、凭据、完整路径、项目身份或对话内容。
          required: true
