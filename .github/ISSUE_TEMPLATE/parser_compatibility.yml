name: Parser compatibility
description: Report missing or incorrect local usage for a specific Agent version
title: "[Parser]: "
labels: [parser, compatibility]
body:
  - type: markdown
    attributes:
      value: |
        Do not upload raw JSONL, SQLite databases, prompts, responses, full paths, session IDs, or credentials. A minimal synthetic fixture is preferred.
  - type: input
    id: source
    attributes:
      label: Agent and version
      placeholder: Claude Code 2.x / Codex 0.x / Kimi Code 1.x
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS, architecture, and Node version
    validations:
      required: true
  - type: dropdown
    id: symptom
    attributes:
      label: Symptom
      options:
        - Source is not detected
        - Source fails to parse
        - Buckets or sessions are missing
        - Token categories are incorrect
        - Model, reasoning effort, or Agent version is incorrect
        - Time or activity is incorrect
        - Duplicate data
        - Other
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Redacted summary and reproduction
      description: Include counts or percentages, not conversation content.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Reviewed doctor output
      render: json
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I did not attach raw Agent data, credentials, full paths, project identity, or conversation content.
          required: true
