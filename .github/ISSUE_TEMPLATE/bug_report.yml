name: Bug report
description: Report a Collector, dashboard, sync, export, or daemon problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Never attach prompts, responses, full paths, cookies, tokens, API keys, config files, or raw Agent databases. Read SUPPORT.md first.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Local dashboard
        - Community sync
        - Background sync / daemon
        - Export or poster
        - Pricing or model identity
        - CLI or installation
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Collector version or commit
      placeholder: 0.4.0 / git commit
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: macOS 26.5.2 arm64, Node 22.x, Warp 0.x
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Use synthetic or redacted values only.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Reviewed doctor output
      description: Paste only doctor --json output you have personally reviewed. This is optional.
      render: json
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, account identity, conversation text, project names, and full paths.
          required: true
