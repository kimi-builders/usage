name: Subscription-limit provider
description: Report setup, authentication, quota mapping, or provider API drift
title: "[Limits]: "
labels: [limits, compatibility]
body:
  - type: markdown
    attributes:
      value: |
        Never paste a cookie, token, API key, cURL command, Keychain value, email, account ID, or raw provider response.
  - type: input
    id: provider
    attributes:
      label: Provider and client version
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS and Collector version
    validations:
      required: true
  - type: dropdown
    id: auth
    attributes:
      label: Credential mode
      options:
        - Local auto-detection
        - Environment variable
        - macOS Keychain
        - No credential / unavailable
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: What happened?
      description: Include the redacted UI error category and expected quota windows.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed all credentials, account details, copied requests, and raw responses.
          required: true
