name: Release npm package

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: npm-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collector:
    name: Release gate · ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: 20, label: Linux · Node 20 compatibility }
          - { os: ubuntu-latest, node: 22, label: Linux · Node 22 LTS }
          - { os: ubuntu-latest, node: 24, label: Linux · Node 24 LTS }
          - { os: macos-latest, node: 22, label: macOS · Node 22 LTS }
          - { os: macos-latest, node: 24, label: macOS · Node 24 LTS }
          - { os: windows-latest, node: 22, label: Windows · Node 22 LTS }
          - { os: windows-latest, node: 24, label: Windows · Node 24 LTS }
    steps:
      - name: Check out release source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Install Collector package
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test Collector and provider contracts
        run: npm run test:collector

  publish:
    name: Build, attest, and publish
    needs: collector
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out release source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Node.js and npm registry
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Use an OIDC-capable npm CLI
        run: npm install --global npm@12.0.1 --ignore-scripts --no-audit --no-fund
      - name: Verify release tag matches package version
        run: node -e "const version=require('./package.json').version; if (process.env.GITHUB_REF_NAME !== 'v'+version) throw new Error('release tag must be v'+version)"
      - name: Install Collector package
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Dashboard dependencies
        run: npm ci --prefix dashboard --ignore-scripts --no-audit --no-fund
      - name: Run the complete release gate
        run: npm run release:check
      - name: Generate CycloneDX SBOMs
        shell: bash
        run: |
          mkdir -p release
          npm sbom --sbom-format cyclonedx > release/collector.cdx.json
          npm --prefix dashboard sbom --sbom-format cyclonedx > release/dashboard.cdx.json
      - name: Pack the reviewed release artifact
        id: pack
        shell: bash
        run: echo "tarball=release/$(npm pack --ignore-scripts --silent --pack-destination release)" >> "$GITHUB_OUTPUT"
      - name: Upload release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-release-${{ github.ref_name }}
          path: release/
          if-no-files-found: error
          retention-days: 90
      - name: Publish through npm Trusted Publishing
        run: npm publish "${{ steps.pack.outputs.tarball }}" --access public --provenance
